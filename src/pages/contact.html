<!--
title: Contact Us | Digital Utility Hub
description: Contact the Digital Utility Hub team with suggestions, feedback, or support requests.
-->
<div class="container py-4" style="max-width: 800px;">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <span>Contact</span>
    </div>
    <h1 class="mb-4">Contact Us</h1>
    <div class="grid grid-cols-2">
        <div class="glass-panel">
            <h3 class="mb-3">Get in Touch</h3>
            <p class="text-muted">We love hearing from our users. Whether you have a feature request, found a bug, or just want to say hi, send us a message.</p>
            <p class="text-muted mt-4"><strong>Email:</strong> <br> hello@digitalutilityhub.com</p>
        </div>
        <div class="glass-panel">
            <form action="mailto:hello@digitalutilityhub.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label class="form-label" for="name">Name</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="message">Message</label>
                    <textarea id="message" class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Send Message</button>
            </form>
        </div>
    </div>
</div>
