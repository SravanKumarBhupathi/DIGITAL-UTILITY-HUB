<!--
title: Free Image Resizer | Digital Utility Hub
description: Resize images to custom dimensions locally in your browser.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Image Resizer</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Image Resizer</h1>
            <p class="text-muted mb-4">Resize images to specific dimensions instantly in your browser.</p>
        </div>
        <button id="favBtn_image-resizer" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="privacy-badge"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.95-7 10.12-3.87-1.17-7-5.45-7-10.12V7.3l7-3.12zM11 14H9l3-4h2l-3 4z"/></svg> Processed completely in your browser</div>

    <div class="glass-panel">
        <div id="resDropArea" class="file-drop-area mb-4">
            <span class="icon">🖼️</span>
            <h3>Drag & Drop Image Here</h3>
            <p class="text-muted text-sm">or click to browse</p>
            <input type="file" id="resInput" class="file-input" accept="image/jpeg, image/png, image/webp">
        </div>

        <div id="resWorkspace" class="hidden">
            <div class="grid grid-cols-2 mb-4" style="grid-template-columns: 1fr 300px;">
                <div class="text-center" style="display:flex; flex-direction:column; justify-content:center; background: var(--bg-color); border: 1px solid var(--border-light); border-radius: 8px; padding: 1rem;">
                    <img id="resPreview" style="max-width: 100%; max-height: 400px; object-fit: contain;">
                </div>
                <div>
                    <h3 class="mb-3">Resize Options</h3>
                    <div class="form-group flex gap-2">
                        <div>
                            <label class="form-label">Width (px)</label>
                            <input type="number" id="resWidth" class="form-control">
                        </div>
                        <div>
                            <label class="form-label">Height (px)</label>
                            <input type="number" id="resHeight" class="form-control">
                        </div>
                    </div>
                    <div class="form-group mb-4">
                        <label class="flex items-center gap-2"><input type="checkbox" id="resLockRatio" checked> Lock Aspect Ratio</label>
                    </div>
                    <button id="downloadResBtn" class="btn btn-primary btn-block mb-2">Download Resized Image</button>
                    <button id="resetResBtn" class="btn btn-outline btn-block">Start Over</button>
                </div>
            </div>
        </div>
    </div>
</div>
