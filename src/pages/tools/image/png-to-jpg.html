<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>PNG to JPG Converter</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">PNG to JPG Converter</h1>
            <p class="text-muted mb-4">Convert images from PNG to JPG instantly in your browser.</p>
        </div>
        <button id="favBtn_png-to-jpg" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="privacy-badge"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.95-7 10.12-3.87-1.17-7-5.45-7-10.12V7.3l7-3.12zM11 14H9l3-4h2l-3 4z"/></svg> Processed completely in your browser</div>

    <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
        <div id="convDropArea" class="file-drop-area mb-4">
            <span class="icon">🖼️</span>
            <h3>Drag & Drop PNG Here</h3>
            <p class="text-muted text-sm">or click to browse</p>
            <input type="file" id="convInput" class="file-input" accept="image/png">
        </div>
        <div id="convWorkspace" class="hidden text-center">
            <img id="convPreview" style="max-width: 100%; max-height: 300px; border-radius: 8px; margin-bottom: 1.5rem; background: #fff;">
            <div class="flex gap-3 justify-center">
                <button id="downloadConvBtn" class="btn btn-primary">Download JPG</button>
                <button id="resetConvBtn" class="btn btn-outline">Start Over</button>
            </div>
        </div>
    </div>
