<!--
title: Merge PDF | Digital Utility Hub
description: Combine multiple PDF files into one securely in your browser.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Merge PDF</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Merge PDF</h1>
            <p class="text-muted mb-4">Combine multiple PDF files into a single document securely.</p>
        </div>
        <button id="favBtn_pdf-merge" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="privacy-badge"><svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L3 6v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V6l-9-4zm0 2.18l7 3.12v4.7c0 4.67-3.13 8.95-7 10.12-3.87-1.17-7-5.45-7-10.12V7.3l7-3.12zM11 14H9l3-4h2l-3 4z"/></svg> Processed completely in your browser</div>

    <div class="glass-panel">
        <div id="pdfMergeDropArea" class="file-drop-area mb-4">
            <span class="icon">📄</span>
            <h3>Drag & Drop PDFs Here</h3>
            <p class="text-muted text-sm">Select multiple files</p>
            <input type="file" id="pdfMergeInput" class="file-input" accept="application/pdf" multiple>
        </div>

        <div id="pdfMergeWorkspace" class="hidden">
            <h3 class="mb-3">Selected Files</h3>
            <div id="pdfMergeList" class="grid grid-cols-1 mb-4 gap-2">
                <!-- File list items -->
            </div>

            <div class="flex gap-3">
                <button id="processMergeBtn" class="btn btn-primary">Merge PDFs</button>
                <button id="resetMergeBtn" class="btn btn-outline">Start Over</button>
            </div>
        </div>
    </div>
</div>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
