<!--
title: Free Case Converter | Digital Utility Hub
description: Convert your text to uppercase, lowercase, title case, sentence case, and more instantly in your browser.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Case Converter</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Case Converter</h1>
            <p class="text-muted mb-4">Easily convert text between different letter cases.</p>
        </div>
        <button id="favBtn_case-converter" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="glass-panel">
        <textarea id="caseInput" class="form-control mb-3" rows="8" placeholder="Type or paste your text here..."></textarea>

        <div class="grid grid-cols-4 mb-3" style="grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));">
            <button class="btn btn-outline case-btn" data-action="upper">UPPERCASE</button>
            <button class="btn btn-outline case-btn" data-action="lower">lowercase</button>
            <button class="btn btn-outline case-btn" data-action="title">Title Case</button>
            <button class="btn btn-outline case-btn" data-action="sentence">Sentence case</button>
            <button class="btn btn-outline case-btn" data-action="camel">camelCase</button>
            <button class="btn btn-outline case-btn" data-action="snake">snake_case</button>
            <button class="btn btn-outline case-btn" data-action="kebab">kebab-case</button>
        </div>

        <div class="mt-3" style="display: flex; gap: 1rem;">
            <button id="clearCaseBtn" class="btn btn-outline">Clear</button>
            <button id="copyCaseBtn" class="btn btn-primary">Copy Result</button>
        </div>
    </div>
</div>
