<!--
title: Text Cleaner | Digital Utility Hub
description: Clean up text by removing extra spaces, blank lines, and normalizing formatting.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Text Cleaner</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Text Cleaner</h1>
            <p class="text-muted mb-4">Clean up messy text formatting automatically.</p>
        </div>
        <button id="favBtn_text-cleaner" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="glass-panel">
        <textarea id="cleanerInput" class="form-control mb-3" rows="10" placeholder="Paste messy text here..."></textarea>

        <div class="grid grid-cols-2 mb-3">
            <label class="flex items-center gap-2"><input type="checkbox" id="cleanExtraSpaces" checked> Remove extra spaces</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="cleanBlankLines" checked> Remove blank lines</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="cleanTrimLines" checked> Trim each line</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="cleanHtmlTags"> Remove HTML tags</label>
        </div>

        <div class="mt-3" style="display: flex; gap: 1rem;">
            <button id="cleanTextBtn" class="btn btn-primary">Clean Text</button>
            <button id="clearCleanerBtn" class="btn btn-outline">Clear</button>
            <button id="copyCleanerBtn" class="btn btn-outline">Copy Result</button>
        </div>
    </div>
</div>
