<!--
title: Remove Duplicate Lines | Digital Utility Hub
description: Quickly find and remove duplicate lines from a list of text.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Remove Duplicate Lines</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Remove Duplicate Lines</h1>
            <p class="text-muted mb-4">Filter out duplicate lines from your text instantly.</p>
        </div>
        <button id="favBtn_remove-duplicates" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="glass-panel">
        <textarea id="dupInput" class="form-control mb-3" rows="10" placeholder="Paste your list here..."></textarea>

        <div class="form-group flex items-center gap-3 mb-3">
            <label class="flex items-center gap-2"><input type="checkbox" id="dupCaseSensitive" checked> Case Sensitive</label>
            <label class="flex items-center gap-2"><input type="checkbox" id="dupTrim" checked> Trim whitespace first</label>
        </div>

        <div class="mt-3" style="display: flex; gap: 1rem;">
            <button id="removeDupBtn" class="btn btn-primary">Remove Duplicates</button>
            <button id="clearDupBtn" class="btn btn-outline">Clear</button>
            <button id="copyDupBtn" class="btn btn-outline">Copy Result</button>
        </div>

        <div id="dupStats" class="mt-3 text-muted text-sm hidden">Removed <span id="dupCount" style="color:var(--primary-accent); font-weight:bold;">0</span> duplicate lines.</div>
    </div>
</div>
