<!--
title: URL Slug Generator | Digital Utility Hub
description: Convert text or article titles into URL-friendly slugs.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Slug Generator</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
            <h1 class="mb-2">Slug Generator</h1>
            <p class="text-muted mb-4">Convert text into a URL-friendly slug.</p>
        </div>
        <button id="favBtn_slug-generator" class="btn btn-outline btn-sm">☆ Favorite</button>
    </div>

    <div class="glass-panel">
        <div class="form-group">
            <label class="form-label">Input Text</label>
            <input type="text" id="slugInput" class="form-control" placeholder="e.g. How to Build a Modern Website in 2026!">
        </div>

        <div class="form-group">
            <label class="form-label">Generated Slug</label>
            <div style="position: relative;">
                <input type="text" id="slugOutput" class="form-control" readonly style="font-family: monospace;">
                <button id="copySlugBtn" class="btn btn-primary btn-sm" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%);">Copy</button>
            </div>
        </div>
    </div>
</div>
