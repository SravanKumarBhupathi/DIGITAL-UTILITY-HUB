<!--
title: Free Digital Tools | RadiumConvert
description: A collection of free, simple, and fast digital tools including text formatters, PDF utilities, and developer tools.
-->
<div class="container py-4" style="max-width: 600px;">

    <!-- DYNAMIC LISTS INJECTED BY JS -->
    <div id="recentSection" class="hidden mb-4" style="border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; background: var(--surface);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h2 style="margin:0; font-size: 1.2rem; display: flex; align-items: center; gap: 0.5rem;"><span style="color: var(--primary);">🕒</span> Recent Activity</h2>
            <button class="btn btn-icon" onclick="window.DigitalUtils.clearRecents(); location.reload();" style="background: none; border: none; color: var(--text-muted); cursor: pointer;" aria-label="Clear recent">🗑️</button>
        </div>
        <div id="recentGrid" class="grid mb-4" style="grid-template-columns: 1fr; gap: 0.75rem;"></div>
    </div>

    <div class="grid mb-4" style="grid-template-columns: 1fr; gap: 0.75rem;">
        <a href="{{base_url}}tools/pdf/merge.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Merge PDF</h3>
        </a>
        <a href="{{base_url}}tools/pdf/split.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Split PDF</h3>
        </a>
        <a href="{{base_url}}tools/image/compressor.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Image Compressor</h3>
        </a>
        <a href="{{base_url}}tools/image/resizer.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Image Resizer</h3>
        </a>
        <a href="{{base_url}}tools/image/png-to-jpg.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">PNG to JPG</h3>
        </a>
        <a href="{{base_url}}tools/text/word-counter.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Word Counter</h3>
        </a>
        <a href="{{base_url}}tools/developer/json-formatter.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">JSON Formatter</h3>
        </a>
        <a href="{{base_url}}tools/developer/password-generator.html" class="glass-card compact-card" style="padding: 1.25rem;">
            <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Password Generator</h3>
        </a>
    </div>

</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if(window.DigitalUtils) {
        const recent = window.DigitalUtils.getRecentTools();
        if(recent.length > 0) {
            document.getElementById('recentSection').classList.remove('hidden');
            const grid = document.getElementById('recentGrid');
            recent.forEach(r => {
                grid.innerHTML += `<a href="${r.url.replace('/tools/', '{base_url}tools/')}" class="glass-card compact-card" style="padding: 1.25rem;">
                    <h3 style="font-size: 1.1rem; margin: 0; font-weight: 600;">${r.title}</h3>
                </a>`;
            });
        }
    }
});
</script>
