<!--
title: Secure Password Generator | Digital Utility Hub
description: Generate secure, random passwords locally in your browser.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>Password Generator</span>
    </div>

    <h1 class="mb-2">Password Generator</h1>
    <p class="text-muted mb-4">Generate strong, secure passwords locally in your browser.</p>

    <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
        <div style="position: relative; margin-bottom: 2rem;">
            <input type="text" id="passwordOutput" class="form-control" style="font-family: monospace; font-size: 1.5rem; text-align: center; padding-right: 3rem;" readonly>
            <button id="copyPwdBtn" style="position: absolute; right: 0.5rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--primary-accent);" title="Copy">
                📋
            </button>
        </div>

        <div class="form-group">
            <label class="form-label">Password Length: <span id="lengthVal">16</span></label>
            <input type="range" id="pwdLength" min="8" max="64" value="16" style="width: 100%;">
        </div>

        <div class="grid grid-cols-2 mb-4">
            <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="incUpper" checked> Uppercase (A-Z)</label>
            <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="incLower" checked> Lowercase (a-z)</label>
            <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="incNum" checked> Numbers (0-9)</label>
            <label style="display: flex; align-items: center; gap: 0.5rem;"><input type="checkbox" id="incSym" checked> Symbols (!@#$)</label>
        </div>

        <button id="generateBtn" class="btn btn-primary btn-block">Generate Password</button>
    </div>
</div>
