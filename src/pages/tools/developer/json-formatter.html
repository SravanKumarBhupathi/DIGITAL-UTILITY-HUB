description: Format, validate, and beautify JSON data instantly in your browser.

<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}tools/index.html">Tools</a> <span class="separator">/</span> <span>JSON Formatter</span>
    </div>

    <h1 class="mb-2">JSON Formatter</h1>
    <p class="text-muted mb-4">Format, validate and beautify JSON data locally.</p>

    <div class="alert alert-error" id="jsonError"></div>
    <div class="alert alert-success" id="jsonSuccess">Valid JSON</div>

    <div class="glass-panel">
        <textarea id="jsonInput" class="form-control" style="font-family: monospace;" rows="12" placeholder='{"paste": "your JSON here"}'></textarea>

        <div class="mt-3" style="display: flex; gap: 1rem;">
            <button id="formatBtn" class="btn btn-primary">Format JSON</button>
            <button id="minifyBtn" class="btn btn-outline">Minify</button>
            <button id="clearJsonBtn" class="btn btn-outline">Clear</button>
            <button id="copyJsonBtn" class="btn btn-outline">Copy</button>
        </div>
    </div>
</div>
