<!--
title: Age Calculator | Digital Utility Hub
description: Calculate your exact age in years, months, and days based on your date of birth.
-->
<div class="container py-4">
    <div class="breadcrumbs">
        <a href="{{base_url}}index.html">Home</a> <span class="separator">/</span> <a href="{{base_url}}calculators/index.html">Calculators</a> <span class="separator">/</span> <span>Age Calculator</span>
    </div>

    <h1 class="mb-2">Age Calculator</h1>
    <p class="text-muted mb-4">Calculate your exact age down to the day.</p>

    <div class="glass-panel" style="max-width: 600px; margin: 0 auto;">
        <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" id="dobInput" class="form-control">
        </div>

        <button id="calcAgeBtn" class="btn btn-primary btn-block mb-4">Calculate Age</button>

        <div id="ageResultBox" style="display: none;" class="text-center">
            <h3 class="mb-2">Your Age is</h3>
            <h2 id="ageResult" style="color: var(--primary-accent);"></h2>
            <p class="text-muted" id="ageDetails"></p>
        </div>
    </div>
</div>
