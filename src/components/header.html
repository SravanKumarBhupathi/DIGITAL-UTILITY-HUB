<header class="site-header">
    <div class="container nav-container">
        <a href="{{base_url}}index.html" class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" style="color: var(--primary);"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor" stroke="none"/></svg>
            RadiumConvert
        </a>

        <div class="header-right">
            <div class="search-bar">
                <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="search" class="form-control search-input" placeholder="Search tools, guides...">
            </div>

            <button class="mobile-search-trigger hidden" aria-label="Open search">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </button>

            <nav class="nav-links">
                <a href="{{base_url}}tools/index.html">Tools</a>
                <a href="{{base_url}}calculators/index.html">Calculators</a>
            </nav>

            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme" title="Switch to dark mode">
                ☀️
            </button>

            <button class="mobile-menu-btn" aria-label="Toggle Menu" aria-expanded="false">
                ☰
            </button>
        </div>
    </div>
</header>

<!-- Mobile Keyboard-Safe Search Overlay -->
<div id="mobileSearchOverlay">
    <div class="mobile-search-header">
        <input type="search" id="mobileSearchInput" class="form-control" placeholder="Search tools...">
        <button class="mobile-search-close" aria-label="Close search">✕</button>
    </div>
    <div class="mobile-search-results" id="mobileSearchResults">
        <!-- Results inject here -->
        <div class="text-center text-muted" style="margin-top: 2rem;">Type to search</div>
    </div>
</div>
